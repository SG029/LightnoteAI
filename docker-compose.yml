# Mongo only. The three application services run natively via
# `npm run dev` so that the Python worker keeps direct access to
# your GPU without the NVIDIA Container Toolkit / WSL2 detour.
services:
  mongo:
    image: mongo:7
    container_name: lightedit-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
